<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شارت الذهب المباشر</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-color; margin: 0; padding: 0; }
        body { background-color: #0f172a; color: #fff; font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; }
        #header { padding: 15px; background: #1e293b; text-align: center; }
        #chart-container { flex: 1; width: 100%; height: 80vh; }
    </style>
</head>
<body>

    <div id="header">
        <h3>الذهب (XAU/USD) - مباشر</h3>
        <p id="price-display">جاري جلب البيانات...</p>
    </div>

    <div id="chart-container"></div>

    <script>
        const API_KEY = '7d7188f318b54de7b8b57714d0ae53b4';
        const container = document.getElementById('chart-container');
        
        const chart = LightweightCharts.createChart(container, {
            layout: { backgroundColor: '#0f172a', textColor: '#f8fafc' },
            grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
            timeScale: { timeVisible: true }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e',
            downColor: '#ef4444',
            borderDownColor: '#ef4444',
            borderUpColor: '#22c55e',
            wickDownColor: '#ef4444',
            wickUpColor: '#22c55e',
        });

        async function fetchGoldData() {
            try {
                const res = await fetch(`https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=5min&outputsize=80&apikey=${API_KEY}`);
                const data = await res.json();

                if (data.values) {
                    const formattedData = data.values.reverse().map(item => ({
                        time: new Date(item.datetime).getTime() / 1000,
                        open: parseFloat(item.open),
                        high: parseFloat(item.high),
                        low: parseFloat(item.low),
                        close: parseFloat(item.close)
                    }));

                    candlestickSeries.setData(formattedData);
                    const lastClose = formattedData[formattedData.length - 1].close;
                    document.getElementById('price-display').innerText = `السعر الحالي: $${lastClose}`;
                } else {
                    document.getElementById('price-display').innerText = 'خطأ في جلب السعر (تأكد من النت)';
                }
            } catch (err) {
                document.getElementById('price-display').innerText = 'تعذر الاتصال بالخادم';
            }
        }

        fetchGoldData();
    </script>
</body>
</html>
