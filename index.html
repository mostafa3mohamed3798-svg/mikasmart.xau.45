<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Pro Gold Engine - Clean</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0f19; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .top-price-card { 
            background: linear-gradient(145deg, #151c2c, #0e1420); 
            border-radius: 16px; 
            padding: 18px; 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
            border: 1px solid #232d42; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            margin-bottom: 12px; 
        }
        
        .header-title { font-size: 1.2rem; font-weight: bold; color: #10b981; margin-bottom: 4px; }
        .symbol-name { font-size: 0.85rem; color: #94a3b8; margin-bottom: 8px; }
        
        .price-display { 
            font-size: 2.7rem; 
            font-weight: 800; 
            color: #f59e0b; 
            letter-spacing: 1px; 
            margin: 4px 0; 
            line-height: 1; 
            transition: color 0.3s ease;
        }
        .status-badge { font-size: 0.8rem; color: #10b981; margin-top: 4px; }
        
        .signal-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            margin-top: 10px; 
            padding-top: 10px; 
            border-top: 1px solid #1e293b; 
        }

        .signal-tag { 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 0.95rem; 
            transition: all 0.3s ease;
        }
        .signal-buy { background-color: rgba(34, 197, 94, 0.18); color: #22c55e; border: 1px solid #22c55e; }
        .signal-sell { background-color: rgba(239, 68, 68, 0.18); color: #ef4444; border: 1px solid #ef4444; }
        .signal-wait { background-color: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid #94a3b8; }

        .signal-power { color: #94a3b8; font-size: 0.9rem; }

        /* شبكة الفلاتر الموسعة */
        .filters-dashboard {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 600px;
            margin-bottom: 12px;
        }

        .filter-card {
            background: #151c2c;
            border: 1px solid #232d42;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        .filter-label { font-size: 0.70rem; color: #64748b; font-weight: 600; margin-bottom: 4px; }
        .filter-value { font-size: 0.82rem; font-weight: bold; color: #f8fafc; }

        .chart-card {
            background: #151c2c; 
            border-radius: 16px; 
            padding: 12px; 
            width: 100%; 
            max-width: 600px; 
            border: 1px solid #232d42; 
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chart-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: #0e1420;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #1e293b;
        }

        .tf-group, .indicator-group { display: flex; gap: 4px; }

        .tf-btn, .indicator-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
        }

        .tf-btn.active { background: #10b981; color: #0b0f19; border-color: #10b981; }
        .btn-ema.active { background: rgba(255, 183, 3, 0.2); color: #ffb703; border-color: #ffb703; }
        .btn-vol.active { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: #10b981; }

        .chart-container { 
            width: 100%; 
            height: 420px; 
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #000;
        }

        #chart { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <div class="top-price-card">
        <div class="header-title">🤖 Mika Pro Gold Engine</div>
        <div class="symbol-name">Bybit Futures - XAUUSDT</div>
        
        <div id="price" class="price-display">جاري التحميل...</div>
        <div id="status" class="status-badge">● الفلاتر الذكية نشطة...</div>
        
        <div class="signal-container">
            <span id="signalTag" class="signal-tag signal-wait">⚪ ANALYZING...</span>
            <span class="signal-power">التوافق: <strong id="signalPower" style="color: #fff;">0%</strong></span>
        </div>
    </div>

    <!-- شبكة الفلاتر الشاملة -->
    <div class="filters-dashboard">
        <div class="filter-card">
            <div class="filter-label">📊 RSI FILTER (>75 Block)</div>
            <div id="rsiFilterVal" class="filter-value" style="color: #94a3b8;">--</div>
        </div>
        <div class="filter-card">
            <div class="filter-label">⚡ STOCHASTIC (>90 Block)</div>
            <div id="stochFilterVal" class="filter-value" style="color: #94a3b8;">--</div>
        </div>
        <div class="filter-card">
            <div class="filter-label">📏 DISTANCE FROM EMA 20</div>
            <div id="emaDistVal" class="filter-value" style="color: #94a3b8;">--</div>
        </div>
        <div class="filter-card">
            <div class="filter-label">🛡️ S/R & RETEST ZONE</div>
            <div id="srRetestVal" class="filter-value" style="color: #94a3b8;">--</div>
        </div>
        <div class="filter-card">
            <div class="filter-label">💧 VOLUME LIQUIDITY</div>
            <div id="volFilterVal" class="filter-value" style="color: #94a3b8;">--</div>
        </div>
        <div class="filter-card">
            <div class="filter-label">📰 NEWS & VOLATILITY</div>
            <div id="newsFilterVal" class="filter-value" style="color: #22c55e;">SAFE 🟢</div>
        </div>
    </div>

    <div class="chart-card">
        <div class="chart-toolbar">
            <div class="tf-group">
                <button class="tf-btn" onclick="changeTimeframe('1')">1m</button>
                <button class="tf-btn" onclick="changeTimeframe('5')">5m</button>
                <button class="tf-btn active" onclick="changeTimeframe('15')">15m</button>
                <button class="tf-btn" onclick="changeTimeframe('60')">1h</button>
                <button class="tf-btn" onclick="changeTimeframe('240')">4h</button>
            </div>
            <div class="indicator-group">
                <button id="emaToggle" class="indicator-btn btn-ema active" onclick="toggleEMA()">EMA 20/50</button>
                <button id="volToggle" class="indicator-btn btn-vol active" onclick="toggleVolume()">Volume</button>
            </div>
        </div>

        <div class="chart-container">
            <div id="chart"></div>
        </div>
    </div>

    <script>
        const priceElement = document.getElementById('price');
        const statusElement = document.getElementById('status');
        const signalTagElement = document.getElementById('signalTag');
        const signalPowerElement = document.getElementById('signalPower');

        const rsiFilterVal = document.getElementById('rsiFilterVal');
        const stochFilterVal = document.getElementById('stochFilterVal');
        const emaDistVal = document.getElementById('emaDistVal');
        const srRetestVal = document.getElementById('srRetestVal');
        const volFilterVal = document.getElementById('volFilterVal');
        const newsFilterVal = document.getElementById('newsFilterVal');
        
        let lastPrice = 0;
        let currentTimeframe = '15';
        let showEMAs = true;
        let showVolume = true;

        const chart = LightweightCharts.createChart(document.getElementById('chart'), {
            layout: { backgroundColor: '#020408', textColor: '#94a3b8' },
            grid: { vertLines: { color: 'rgba(30, 41, 59, 0.25)' }, horzLines: { color: 'rgba(30, 41, 59, 0.25)' } },
            timeScale: { timeVisible: true, secondsVisible: false },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e', downColor: '#ef4444', borderVisible: true,
            borderUpColor: '#22c55e', borderDownColor: '#ef4444', wickUpColor: '#22c55e', wickDownColor: '#ef4444'
        });

        const volumeSeries = chart.addHistogramSeries({
            color: '#26a69a', priceFormat: { type: 'volume' }, priceScaleId: '', scaleMargins: { top: 0.8, bottom: 0 }
        });

        const ema20Series = chart.addLineSeries({ color: '#3b82f6', lineWidth: 2, priceLineVisible: false });
        const ema50Series = chart.addLineSeries({ color: '#ffb703', lineWidth: 2, priceLineVisible: false });

        function calculateEMA(candles, period) {
            if (candles.length < period) return [];
            const k = 2 / (period + 1);
            let emaData = [];
            let emaPrev = candles[0].close;
            for (let i = 0; i < candles.length; i++) {
                const close = candles[i].close;
                if (i === 0) emaPrev = close;
                else emaPrev = (close * k) + (emaPrev * (1 - k));
                if (i >= period - 1) emaData.push({ time: candles[i].time, value: emaPrev });
            }
            return emaData;
        }

        function calculateRSI(candles, period = 14) {
            let gains = 0, losses = 0;
            for (let i = 1; i <= period; i++) {
                let diff = candles[i].close - candles[i - 1].close;
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            let avgGain = gains / period;
            let avgLoss = losses / period;

            for (let i = period + 1; i < candles.length; i++) {
                let diff = candles[i].close - candles[i - 1].close;
                if (diff >= 0) {
                    avgGain = (avgGain * (period - 1) + diff) / period;
                    avgLoss = (avgLoss * (period - 1)) / period;
                } else {
                    avgGain = (avgGain * (period - 1)) / period;
                    avgLoss = (avgLoss * (period - 1) - diff) / period;
                }
            }
            let rs = avgGain / (avgLoss || 1);
            return 100 - (100 / (1 + rs));
        }

        function calculateStochastic(candles, period = 14) {
            const slice = candles.slice(-period);
            const currentClose = candles[candles.length - 1].close;
            const lowestLow = Math.min(...slice.map(c => c.low));
            const highestHigh = Math.max(...slice.map(c => c.high));
            return ((currentClose - lowestLow) / ((highestHigh - lowestLow) || 1)) * 100;
        }

        function evaluateProFilters(candles, rawVolumeData) {
            if (candles.length < 50) return;

            const lastCandle = candles[candles.length - 1];
            const lastClose = lastCandle.close;

            // المتوسطات
            const ema20Data = calculateEMA(candles, 20);
            const ema50Data = calculateEMA(candles, 50);
            const lastEMA20 = ema20Data[ema20Data.length - 1].value;

            // 1. فلتر المسافة عن EMA 20 (أكثر من 12 دولار = انتظار رجوع السعر)
            const distFromEMA20 = lastClose - lastEMA20;
            const absDist = Math.abs(distFromEMA20);
            const isTooFarFromEMA = absDist > 12;

            emaDistVal.innerText = `${distFromEMA20 > 0 ? '+' : ''}${distFromEMA20.toFixed(1)}$`;
            if (isTooFarFromEMA) {
                emaDistVal.innerText += " (WAIT PULLBACK ⏳)";
                emaDistVal.style.color = "#f59e0b";
            } else {
                emaDistVal.innerText += " (GOOD 🟢)";
                emaDistVal.style.color = "#22c55e";
            }

            // 2. فلتر RSI (يمنع الشراء إذا أكبر من 75)
            const rsiVal = calculateRSI(candles, 14);
            const isRsiOverbought = rsiVal > 75;
            rsiFilterVal.innerText = `${rsiVal.toFixed(1)} ${isRsiOverbought ? '🚫 (>75)' : '🟢'}`;
            rsiFilterVal.style.color = isRsiOverbought ? "#ef4444" : "#22c55e";

            // 3. فلتر Stochastic (يمنع الشراء إذا أكبر من 90)
            const stochK = calculateStochastic(candles, 14);
            const isStochOverbought = stochK > 90;
            stochFilterVal.innerText = `%K: ${stochK.toFixed(1)} ${isStochOverbought ? '🚫 (>90)' : '🟢'}`;
            stochFilterVal.style.color = isStochOverbought ? "#ef4444" : "#22c55e";

            // 4. فلتر حجم التداول (Volume)
            const recentVols = rawVolumeData.slice(-20);
            const avgVol = recentVols.reduce((acc, curr) => acc + curr.value, 0) / 20;
            const lastVol = rawVolumeData[rawVolumeData.length - 1].value;
            const hasGoodVolume = lastVol > avgVol * 0.8;
            volFilterVal.innerText = hasGoodVolume ? "OPTIMAL 💧" : "LOW ⚠️";
            volFilterVal.style.color = hasGoodVolume ? "#22c55e" : "#f59e0b";

            // 5. فلتر مناطق الدعم والمقاومة وإعادة الاختبار (S/R & Retest)
            const recentSlice = candles.slice(-30);
            const supportLevel = Math.min(...recentSlice.map(c => c.low));
            const nearSupport = Math.abs(lastClose - supportLevel) < 4;
            const isRetesting = nearSupport && lastCandle.low <= supportLevel + 1.5;

            srRetestVal.innerText = isRetesting ? "RETEST ZONE 🎯" : "MID-RANGE ⚖️";
            srRetestVal.style.color = isRetesting ? "#3b82f6" : "#94a3b8";

            // 6. فلتر الأخبار القوية (تقدير بناءً على التذبذب الحاد المفاجئ في الشموع الأخيرة)
            const lastCandleBody = Math.abs(lastCandle.close - lastCandle.open);
            const avgBody = recentSlice.reduce((acc, c) => acc + Math.abs(c.close - c.open), 0) / recentSlice.length;
            const isHighNewsVolatility = lastCandleBody > (avgBody * 2.5);
            
            if (isHighNewsVolatility) {
                newsFilterVal.innerText = "HIGH NEWS ⚡ (WAIT)";
                newsFilterVal.style.color = "#ef4444";
            } else {
                newsFilterVal.innerText = "SAFE 🟢";
                newsFilterVal.style.color = "#22c55e";
            }

            // محرك القرار الصارم
            let canBuy = true;
            if (isRsiOverbought || isStochOverbought || isTooFarFromEMA || isHighNewsVolatility) {
                canBuy = false;
            }

            let signalText = "⚪ WAIT / NEUTRAL";
            let signalClass = "signal-wait";
            let power = 45;

            if (canBuy && (isRetesting || lastClose >= lastEMA20) && hasGoodVolume) {
                signalText = "🟢 STRONG BUY";
                signalClass = "signal-buy";
                power = 90;
            } else if (!canBuy) {
                signalText = "🔴 BLOCKED (CONDitions NOT MET)";
                signalClass = "signal-sell";
                power = 85;
            }

            signalTagElement.innerText = signalText;
            signalTagElement.className = `signal-tag ${signalClass}`;
            signalPowerElement.innerText = `${power}%`;

            if (showEMAs) {
                ema20Series.setData(ema20Data);
                ema50Series.setData(ema50Data);
            } else {
                ema20Series.setData([]);
                ema50Series.setData([]);
            }
        }

        async function loadChartData() {
            try {
                const res = await fetch(`https://api.bybit.com/v5/market/kline?category=linear&symbol=XAUUSDT&interval=${currentTimeframe}&limit=200`);
                const data = await res.json();

                if (data && data.retCode === 0 && data.result && data.result.list) {
                    const list = data.result.list.reverse();
                    const candles = list.map(d => ({
                        time: parseInt(d[0]) / 1000,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));

                    const volumes = list.map(d => ({
                        time: parseInt(d[0]) / 1000,
                        value: parseFloat(d[5]),
                        color: parseFloat(d[4]) >= parseFloat(d[1]) ? 'rgba(34, 197, 94, 0.4)' : 'rgba(239, 68, 68, 0.4)'
                    }));

                    candlestickSeries.setData(candles);
                    if (showVolume) volumeSeries.setData(volumes);
                    else volumeSeries.setData([]);

                    evaluateProFilters(candles, volumes);

                    chart.timeScale().setVisibleLogicalRange({
                        from: candles.length - 35,
                        to: candles.length - 1
                    });
                }
            } catch (err) {}
        }

        async function fetchBybitPrice() {
            try {
                const res = await fetch('https://api.bybit.com/v5/market/tickers?category=linear&symbol=XAUUSDT');
                const data = await res.json();
                
                if (data && data.retCode === 0 && data.result && data.result.list.length > 0) {
                    const rawPrice = parseFloat(data.result.list[0].lastPrice);
                    if (lastPrice > 0) {
                        priceElement.style.color = rawPrice > lastPrice ? '#22c55e' : (rawPrice < lastPrice ? '#ef4444' : '#f59e0b');
                    }
                    lastPrice = rawPrice;
                    priceElement.innerText = `$${rawPrice.toFixed(2)}`;
                    statusElement.innerText = "● الفلاتر تعمل حياً بدون توكن";
                }
            } catch (err) {}
        }

        function changeTimeframe(tf) {
            currentTimeframe = tf;
            document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            loadChartData();
        }

        function toggleEMA() {
            showEMAs = !showEMAs;
            document.getElementById('emaToggle').classList.toggle('active', showEMAs);
            loadChartData();
        }

        function toggleVolume() {
            showVolume = !showVolume;
            document.getElementById('volToggle').classList.toggle('active', showVolume);
            loadChartData();
        }

        loadChartData();
        fetchBybitPrice();
        setInterval(fetchBybitPrice, 1000);
        setInterval(loadChartData, 10000);
    </script>
</body>
</html>
