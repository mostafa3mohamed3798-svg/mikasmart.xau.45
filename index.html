<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Smart AI - XAUUSD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: system-ui, -apple-system, sans-serif; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .main-card { background: #151c2c; border-radius: 16px; padding: 20px; width: 100%; max-width: 450px; text-align: center; border: 1px solid #232d42; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
        .logo-title { font-size: 1.4rem; font-weight: bold; color: #10b981; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .symbol { font-size: 1.1rem; color: #94a3b8; font-weight: bold; margin-bottom: 10px; }
        
        /* Binance Live Price Display */
        .price-container { margin: 15px 0; min-height: 50px; display: flex; justify-content: center; align-items: center; }
        .live-price { font-size: 2.2rem; font-weight: bold; color: #f2a900; letter-spacing: 1px; }
        .price-status { font-size: 0.8rem; color: #10b981; margin-top: -5px; margin-bottom: 10px; }
        
        .signal-box { display: inline-flex; align-items: center; gap: 8px; font-size: 1.3rem; font-weight: bold; color: #10b981; margin-bottom: 8px; }
        .strength { color: #10b981; font-size: 1.1rem; margin-bottom: 15px; }
        
        .btn { width: 100%; padding: 12px; background: #10b981; color: #000; font-weight: bold; font-size: 1.05rem; border: none; border-radius: 10px; cursor: pointer; }
        
        .chart-card { background: #151c2c; border-radius: 16px; padding: 10px; width: 100%; max-width: 450px; border: 1px solid #232d42; height: 420px; }
        .tradingview-widget-container { height: 100%; width: 100%; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-title">🤖 Mika Smart AI</div>
        <div class="symbol">XAU/USDT - Binance Direct</div>
        
        <!-- Binance Direct WebSocket Live Price -->
        <div class="price-container">
            <div id="binance-price" class="live-price">جاري التحميل...</div>
        </div>
        <div class="price-status">● اتصال مباشر بسيرفر Binance</div>
        
        <div class="signal-box">
            <span style="color:#22c55e;">🟢</span> BUY
        </div>
        <div class="strength">قوة الإشارة: 91%</div>

        <button class="btn" onclick="location.reload()">تحديث تحليل السوق</button>
    </div>

    <div class="chart-card">
        <!-- TradingView Chart Widget (OKX feed for stable rendering) -->
        <div class="tradingview-widget-container">
          <div id="tradingview_chart" style="height:100%;width:100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "OKX:XAUUSDT",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "save_image": false,
            "container_id": "tradingview_chart"
          });
          </script>
        </div>
    </div>

    <!-- Script to Fetch Real-Time Price Directly from Binance -->
    <script>
        const priceElement = document.getElementById('binance-price');
        
        // الربط المباشر مع سيرفر بينانس للعقود/الأسعار
        const ws = new WebSocket('wss://fstream.binance.com/ws/xauusdt@ticker');

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            if (data && data.c) {
                const price = parseFloat(data.c).toFixed(2);
                priceElement.innerText = `$${price}`;
            }
        };

        ws.onerror = (error) => {
            // في حالة احتياج للبديل المباشر للـ Spot
            const fallbackWs = new WebSocket('wss://stream.binance.com:9443/ws/paxgusdt@ticker');
            fallbackWs.onmessage = (e) => {
                const d = JSON.parse(e.data);
                if (d && d.c) {
                    priceElement.innerText = `$${parseFloat(d.c).toFixed(2)}`;
                }
            };
        };
    </script>

</body>
</html>
