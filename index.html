<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Smart AI - Pro Dashboard</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0f19; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .top-price-card { 
            background: linear-gradient(145deg, #151c2c, #0e1420); 
            border-radius: 16px; 
            padding: 18px; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            border: 1px solid #232d42; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            margin-bottom: 12px; 
        }
        
        .header-title { font-size: 1.2rem; font-weight: bold; color: #10b981; margin-bottom: 4px; }
        .symbol-name { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
        
        .price-display { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: #f59e0b; 
            letter-spacing: 1px; 
            margin: 6px 0; 
            line-height: 1; 
            transition: color 0.3s ease;
        }
        .status-badge { font-size: 0.8rem; color: #10b981; margin-top: 4px; }
        
        .signal-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            margin-top: 10px; 
            padding-top: 10px; 
            border-top: 1px solid #1e293b; 
        }
        .signal-tag { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; }
        .signal-power { color: #94a3b8; font-size: 0.9rem; }

        /* حاوية الشارت الاحترافي */
        .chart-container { 
            background: #151c2c; 
            border-radius: 16px; 
            overflow: hidden;
            width: 100%; 
            max-width: 500px; 
            border: 1px solid #232d42; 
            height: 480px; 
        }
        .tradingview-widget-container {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="top-price-card">
        <div class="header-title">🤖 Mika Smart AI</div>
        <div class="symbol-name">Bybit Futures - XAUUSDT</div>
        
        <div id="price" class="price-display">جاري التحميل...</div>
        <div id="status" class="status-badge">● جاري الاتصال بالبيانات...</div>
        
        <div class="signal-container">
            <span class="signal-tag">🟢 BUY</span>
            <span class="signal-power">قوة الإشارة: <strong style="color: #fff;">91%</strong></span>
        </div>
    </div>

    <!-- شارت TradingView الاحترافي الأصلي المباشر -->
    <div class="chart-container">
        <div class="tradingview-widget-container">
            <div id="tradingview_pro_chart" style="height:100%;width:100%;"></div>
            <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
            <script type="text/javascript">
                new TradingView.widget({
                    "autosize": true,
                    "symbol": "BYBIT:XAUUSDT",
                    "interval": "15",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "ar",
                    "toolbar_bg": "#151c2c",
                    "enable_publishing": false,
                    "allow_symbol_change": false,
                    "container_id": "tradingview_pro_chart"
                });
            </script>
        </div>
    </div>

    <script>
        const priceElement = document.getElementById('price');
        const statusElement = document.getElementById('status');
        let lastPrice = 0;

        async function fetchBybitPrice() {
            const tickerUrl = 'https://api.bybit.com/v5/market/tickers?category=linear&symbol=XAUUSDT';

            try {
                const response = await fetch(tickerUrl);
                const data = await response.json();
                
                if (data && data.retCode === 0 && data.result && data.result.list.length > 0) {
                    const rawPrice = parseFloat(data.result.list[0].lastPrice);
                    const formattedPrice = rawPrice.toFixed(2);
                    
                    if (lastPrice > 0) {
                        if (rawPrice > lastPrice) priceElement.style.color = '#22c55e';
                        else if (rawPrice < lastPrice) priceElement.style.color = '#ef4444';
                    }
                    lastPrice = rawPrice;

                    priceElement.innerText = `$${formattedPrice}`;
                    statusElement.innerText = "● اتصال حي ومباشر (Bybit API)";
                    statusElement.style.color = "#10b981";
                }
            } catch (err) {
                console.error("Price Fetch Error:", err);
                statusElement.innerText = "⚠️ جاري إعادة الاتصال...";
                statusElement.style.color = "#f59e0b";
            }
        }

        fetchBybitPrice();
        setInterval(fetchBybitPrice, 1000);
    </script>

</body>
</html>
