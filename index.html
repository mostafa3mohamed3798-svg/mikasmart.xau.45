<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Smart AI - XAUUSD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: system-ui, sans-serif; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .main-card { background: #151c2c; border-radius: 16px; padding: 20px; width: 100%; max-width: 450px; text-align: center; border: 1px solid #232d42; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
        .logo-title { font-size: 1.4rem; font-weight: bold; color: #10b981; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .symbol { font-size: 1.2rem; color: #94a3b8; font-weight: bold; margin-bottom: 10px; }
        .signal-box { display: inline-flex; align-items: center; gap: 8px; font-size: 1.3rem; font-weight: bold; color: #10b981; margin-bottom: 8px; }
        .strength { color: #10b981; font-size: 1.1rem; margin-bottom: 15px; }
        
        .btn { width: 100%; padding: 12px; background: #10b981; color: #000; font-weight: bold; font-size: 1.05rem; border: none; border-radius: 10px; cursor: pointer; }
        
        .chart-card { background: #151c2c; border-radius: 16px; padding: 10px; width: 100%; max-width: 450px; border: 1px solid #232d42; height: 400px; }
        .tradingview-widget-container { height: 100%; width: 100%; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-title">🤖 Mika Smart AI</div>
        <div class="symbol">XAU/USD - الذهب مقابل الدولار</div>
        
        <div class="signal-box">
            <span style="color:#22c55e;">🟢</span> BUY
        </div>
        <div class="strength">قوة الإشارة: 91%</div>

        <button class="btn" onclick="location.reload()">تحديث تحليل السوق</button>
    </div>

    <div class="chart-card">
        <!-- TradingView Widget BEGIN -->
        <div class="tradingview-widget-container">
          <div id="tradingview_chart" style="height:100%;width:100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "OANDA:XAUUSD",
            "interval": "1",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "save_image": false,
            "container_id": "tradingview_chart"
          });
          </script>
        </div>
        <!-- TradingView Widget END -->
    </div>

</body>
</html>
