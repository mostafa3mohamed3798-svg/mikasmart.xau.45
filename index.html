<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Smart AI - Ultra Dark Dashboard</title>
    <!-- مكتبة الرسم البياني المباشرة والمضمونة -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #03050a; 
            color: #f1f5f9; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
        }
        
        /* كارت السعر العلوي الفاخر */
        .top-price-card { 
            background: linear-gradient(160deg, #0b0f19 0%, #060911 100%); 
            border-radius: 20px; 
            padding: 20px; 
            width: 100%; 
            max-width: 580px; 
            text-align: center; 
            border: 1px solid #1e293b; 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), inset 0 1px 1px rgba(255, 255, 255, 0.05); 
            margin-bottom: 14px; 
        }
        
        .header-title { font-size: 1.25rem; font-weight: 800; color: #10b981; letter-spacing: 0.5px; margin-bottom: 2px; }
        .symbol-name { font-size: 0.85rem; color: #64748b; font-weight: 500; margin-bottom: 12px; }
        
        .price-display { 
            font-size: 2.8rem; 
            font-weight: 900; 
            color: #f59e0b; 
            letter-spacing: 1.5px; 
            margin: 4px 0; 
            line-height: 1; 
            text-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
            transition: color 0.25s ease, text-shadow 0.25s ease;
        }
        .status-badge { font-size: 0.8rem; color: #10b981; font-weight: 500; margin-top: 6px; }
        
        .signal-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 16px; 
            margin-top: 14px; 
            padding-top: 12px; 
            border-top: 1px solid rgba(255, 255, 255, 0.06); 
        }
        .signal-tag { 
            background: rgba(34, 197, 94, 0.12); 
            color: #4ade80; 
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 4px 14px; 
            border-radius: 20px; 
            font-weight: 700; 
            font-size: 0.9rem;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.15);
        }
        .signal-power { color: #94a3b8; font-size: 0.88rem; }

        /* حاوية الشارت الاحترافية */
        .chart-card {
            background: #060911; 
            border-radius: 20px; 
            padding: 14px; 
            width: 100%; 
            max-width: 580px; 
            border: 1px solid #1e293b; 
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255, 255, 255, 0.03);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* شريط الأدوات والفريمات الزجاجي */
        .chart-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tf-group {
            display: flex;
            gap: 4px;
        }

        .tf-btn, .indicator-btn {
            background: #0f172a;
            color: #64748b;
            border: 1px solid #1e293b;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tf-btn:hover, .indicator-btn:hover {
            color: #f8fafc;
            border-color: #334155;
        }

        .tf-btn.active {
            background: #10b981;
            color: #022c22;
            border-color: #10b981;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.3);
        }

        .indicator-btn.active {
            background: rgba(255, 183, 3, 0.15);
            color: #ffb703;
            border-color: #ffb703;
            box-shadow: 0 0 10px rgba(255, 183, 3, 0.2);
        }

        .chart-container { 
            width: 100%; 
            height: 460px; 
            position: relative;
            border-radius: 12px;
            overflow: hidden;
        }

        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="top-price-card">
        <div class="header-title">🤖 Mika Smart AI</div>
        <div class="symbol-name">Bybit Futures - XAUUSDT</div>
        
        <div id="price" class="price-display">جاري التحميل...</div>
        <div id="status" class="status-badge">● جاري الاتصال بالسعر الحي...</div>
        
        <div class="signal-container">
            <span class="signal-tag">🟢 BUY</span>
            <span class="signal-power">قوة الإشارة: <strong style="color: #fff;">91%</strong></span>
        </div>
    </div>

    <div class="chart-card">
        <!-- شريط أدوات التحكم بالفريمات والمؤشر -->
        <div class="chart-toolbar">
            <div class="tf-group">
                <button class="tf-btn" onclick="changeTimeframe('1')">1m</button>
                <button class="tf-btn" onclick="changeTimeframe('5')">5m</button>
                <button class="tf-btn active" onclick="changeTimeframe('15')">15m</button>
                <button class="tf-btn" onclick="changeTimeframe('60')">1h</button>
                <button class="tf-btn" onclick="changeTimeframe('240')">4h</button>
                <button class="tf-btn" onclick="changeTimeframe('D')">1D</button>
            </div>
            <div>
                <button id="emaToggle" class="indicator-btn active" onclick="toggleEMA()">EMA (20)</button>
            </div>
        </div>

        <!-- منطقة الرسم الشاملة -->
        <div class="chart-container">
            <div id="chart"></div>
        </div>
    </div>

    <script>
        const priceElement = document.getElementById('price');
        const statusElement = document.getElementById('status');
        let lastPrice = 0;
        let currentTimeframe = '15';
        let showEMA = true;

        // 1. تهيئة الشارت المحلي بخلفية أسود فاخرة وجماليات متكاملة
        const chartContainer = document.getElementById('chart');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                backgroundColor: '#060911',
                textColor: '#64748b',
                fontSize: 12,
                fontFamily: 'Segoe UI, sans-serif',
            },
            grid: {
                vertLines: { color: 'rgba(30, 41, 59, 0.4)', style: 1 },
                horzLines: { color: 'rgba(30, 41, 59, 0.4)', style: 1 },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: '#334155', width: 1, style: 2, labelBackgroundColor: '#0f172a' },
                horzLine: { color: '#334155', width: 1, style: 2, labelBackgroundColor: '#0f172a' },
            },
            priceScale: { 
                borderColor: '#1e293b',
                textColor: '#94a3b8',
                alignLabels: true,
            },
            timeScale: { 
                borderColor: '#1e293b',
                timeVisible: true, 
                secondsVisible: false,
                textColor: '#94a3b8',
            },
            handleScroll: { vertTouchDrag: false },
        });

        // الشموع اليابانية بتفاصيل واقعية وألوان نيون متناسقة
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#00e676',           // أخضر نيون متوهج للشموع الصاعدة
            downColor: '#ff1744',         // أحمر نيون قوي للشموع الهابطة
            borderVisible: true,
            borderUpColor: '#00e676',
            borderDownColor: '#ff1744',
            wickUpColor: '#00e676',       // الفتيل الصاعد
            wickDownColor: '#ff1744',     // الفتيل الهابط
        });

        // خط مؤشر EMA 20 الذهبي
        const emaSeries = chart.addLineSeries({
            color: '#ffb703',
            lineWidth: 2,
            title: 'EMA 20',
            crosshairMarkerVisible: true,
            priceLineVisible: false,
        });

        // 2. خوارزمية حساب المتوسط المتحرك الأسي EMA
        function calculateEMA(candles, period = 20) {
            const k = 2 / (period + 1);
            let emaData = [];
            let emaPrev = candles[0].close;

            for (let i = 0; i < candles.length; i++) {
                const close = candles[i].close;
                if (i === 0) {
                    emaPrev = close;
                } else {
                    emaPrev = (close * k) + (emaPrev * (1 - k));
                }
                if (i >= period - 1) {
                    emaData.push({ time: candles[i].time, value: emaPrev });
                }
            }
            return emaData;
        }

        // 3. جلب بيانات الشموع وتطبيق الرسم المحلي
        async function loadChartData() {
            const klineUrl = `https://api.bybit.com/v5/market/kline?category=linear&symbol=XAUUSDT&interval=${currentTimeframe}&limit=150`;
            try {
                const response = await fetch(klineUrl);
                const data = await response.json();

                if (data && data.retCode === 0 && data.result && data.result.list) {
                    const formattedCandles = data.result.list.map(d => ({
                        time: parseInt(d[0]) / 1000,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    })).reverse();

                    candlestickSeries.setData(formattedCandles);

                    if (showEMA) {
                        const emaData = calculateEMA(formattedCandles, 20);
                        emaSeries.setData(emaData);
                    } else {
                        emaSeries.setData([]);
                    }

                    chart.timeScale().fitContent();
                }
            } catch (err) {
                console.error("Chart Fetch Error:", err);
            }
        }

        // 4. تغيير الفريمات الزمانية
        function changeTimeframe(tf) {
            currentTimeframe = tf;
            document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadChartData();
        }

        // 5. التبديل لمؤشر EMA
        function toggleEMA() {
            showEMA = !showEMA;
            const btn = document.getElementById('emaToggle');
            btn.classList.toggle('active', showEMA);
            loadChartData();
        }

        // 6. جلب السعر اللحظي مع تأثير التوهج الصاعد والهابط
        async function fetchBybitPrice() {
            const tickerUrl = 'https://api.bybit.com/v5/market/tickers?category=linear&symbol=XAUUSDT';

            try {
                const response = await fetch(tickerUrl);
                const data = await response.json();
                
                if (data && data.retCode === 0 && data.result && data.result.list.length > 0) {
                    const rawPrice = parseFloat(data.result.list[0].lastPrice);
                    const formattedPrice = rawPrice.toFixed(2);
                    
                    if (lastPrice > 0) {
                        if (rawPrice > lastPrice) {
                            priceElement.style.color = '#00e676';
                            priceElement.style.textShadow = '0 0 25px rgba(0, 230, 118, 0.4)';
                        } else if (rawPrice < lastPrice) {
                            priceElement.style.color = '#ff1744';
                            priceElement.style.textShadow = '0 0 25px rgba(255, 23, 68, 0.4)';
                        }
                    }
                    lastPrice = rawPrice;

                    priceElement.innerText = `$${formattedPrice}`;
                    statusElement.innerText = "● اتصال حي مباشر بـ Bybit API";
                    statusElement.style.color = "#10b981";
                }
            } catch (err) {
                console.error("Price Fetch Error:", err);
                statusElement.innerText = "⚠️ جاري إعادة الاتصال...";
                statusElement.style.color = "#f59e0b";
            }
        }

        // إطلاق الاستدعاءات الدورية
        loadChartData();
        fetchBybitPrice();
        setInterval(fetchBybitPrice, 1000);
        setInterval(loadChartData, 10000);
    </script>

</body>
</html>
