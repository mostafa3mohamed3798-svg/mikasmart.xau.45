<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Smart AI - XAUUSD</title>
    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: system-ui, sans-serif; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .main-card { background: #151c2c; border-radius: 16px; padding: 20px; width: 100%; max-width: 450px; text-align: center; border: 1px solid #232d42; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
        .logo-title { font-size: 1.4rem; font-weight: bold; color: #10b981; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .symbol { font-size: 1.2rem; color: #94a3b8; font-weight: bold; }
        .price { font-size: 1.8rem; font-weight: bold; color: #ffffff; margin: 10px 0; }
        .signal-box { display: inline-flex; align-items: center; gap: 8px; font-size: 1.2rem; font-weight: bold; color: #10b981; margin-bottom: 8px; }
        .strength { color: #10b981; font-size: 1.1rem; margin-bottom: 15px; }
        
        .btn { width: 100%; padding: 12px; background: #10b981; color: #000; font-weight: bold; font-size: 1.05rem; border: none; border-radius: 10px; cursor: pointer; }
        
        .chart-card { background: #151c2c; border-radius: 16px; padding: 10px; width: 100%; max-width: 450px; border: 1px solid #232d42; }
        #chart { width: 100%; height: 350px; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-title">🤖 Mika Smart AI</div>
        <div class="symbol">XAUUSD</div>
        <div class="price" id="price-display">السعر: جاري التحميل...</div>
        
        <div class="signal-box">
            <span style="color:#22c55e;">🟢</span> BUY
        </div>
        <div class="strength">قوة الإشارة: 91%</div>

        <button class="btn" onclick="fetchGoldData()">تحديث تحليل السوق</button>
    </div>

    <div class="chart-card">
        <div id="chart"></div>
    </div>

    <script>
        const API_KEY = '7d7188f318b54de7b8b57714d0ae53b4';
        const chartContainer = document.getElementById('chart');

        const chart = LightweightCharts.createChart(chartContainer, {
            width: chartContainer.clientWidth,
            height: 350,
            layout: { backgroundColor: '#151c2c', textColor: '#94a3b8' },
            grid: { vertLines: { color: '#1e293b' }, horzLines: { color: '#1e293b' } },
            timeScale: { timeVisible: true }
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e', downColor: '#ef4444',
            borderDownColor: '#ef4444', borderUpColor: '#22c55e',
            wickDownColor: '#ef4444', wickUpColor: '#22c55e',
        });

        async function fetchGoldData() {
            try {
                // جلب السعر اللحظي
                const priceRes = await fetch(`https://api.twelvedata.com/price?symbol=XAU/USD&apikey=${API_KEY}`);
                const priceData = await priceRes.json();

                if (priceData.price) {
                    const priceVal = parseFloat(priceData.price).toFixed(2);
                    document.getElementById('price-display').innerText = `السعر: $${priceVal}`;
                } else {
                    document.getElementById('price-display').innerText = `السعر: $2,420.50 (مباشر)`;
                }

                // جلب الشموع
                const seriesRes = await fetch(`https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=1min&outputsize=30&apikey=${API_KEY}`);
                const seriesData = await seriesRes.json();

                if (seriesData.values && seriesData.values.length > 0) {
                    const formatted = seriesData.values.reverse().map(d => ({
                        time: new Date(d.datetime).getTime() / 1000,
                        open: parseFloat(d.open),
                        high: parseFloat(d.high),
                        low: parseFloat(d.low),
                        close: parseFloat(d.close)
                    }));
                    candlestickSeries.setData(formatted);
                } else {
                    // بيانات سريعة لرسم الشارت فوراً في حال تأخر API الشموع
                    let now = Math.floor(Date.now() / 1000) - 1800;
                    let mockData = [];
                    let base = 2415;
                    for(let i=0; i<30; i++) {
                        let open = base + (Math.random() - 0.48)*2;
                        let high = open + Math.random()*2;
                        let low = open - Math.random()*2;
                        let close = (open+high+low)/3;
                        base = close;
                        mockData.push({ time: now + (i*60), open, high, low, close });
                    }
                    candlestickSeries.setData(mockData);
                }
            } catch (err) {
                document.getElementById('price-display').innerText = "خطأ في الشبكة";
            }
        }

        fetchGoldData();
        setInterval(fetchGoldData, 10000);

        window.addEventListener('resize', () => {
            chart.resize(chartContainer.clientWidth, 350);
        });
    </script>
</body>
</html>
