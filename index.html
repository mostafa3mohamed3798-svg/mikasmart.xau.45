<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Smart AI - XAUUSD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0f19; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        /* كارت السعر العلوي الدقيق */
        .top-price-card { 
            background: linear-gradient(145deg, #151c2c, #0e1420); 
            border-radius: 16px; 
            padding: 20px; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            border: 1px solid #232d42; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            margin-bottom: 12px; 
        }
        .header-title { font-size: 1.2rem; font-weight: bold; color: #10b981; margin-bottom: 4px; }
        .symbol-name { font-size: 0.9rem; color: #94a3b8; margin-bottom: 12px; }
        .price-display { font-size: 2.5rem; font-weight: 800; color: #f59e0b; letter-spacing: 1px; margin: 8px 0; line-height: 1; }
        .status-badge { font-size: 0.8rem; color: #10b981; margin-top: 6px; }
        
        .signal-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            margin-top: 12px; 
            padding-top: 10px; 
            border-top: 1px solid #1e293b; 
        }
        .signal-tag { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; }
        .signal-power { color: #94a3b8; font-size: 0.9rem; }

        /* حاوية الشارت */
        .chart-container { 
            background: #151c2c; 
            border-radius: 16px; 
            padding: 8px; 
            width: 100%; 
            max-width: 500px; 
            border: 1px solid #232d42; 
            height: 440px; 
        }
    </style>
</head>
<body>

    <!-- كارت السعر العلوي الدقيق -->
    <div class="top-price-card">
        <div class="header-title">🤖 Mika Smart AI</div>
        <div class="symbol-name">سعر الذهب المباشر (دقة عالية)</div>
        
        <div id="price" class="price-display">جاري التحميل...</div>
        <div id="status" class="status-badge">● متصل بالبث المباشر</div>
        
        <div class="signal-container">
            <span class="signal-tag">🟢 BUY</span>
            <span class="signal-power">قوة الإشارة: <strong style="color: #fff;">91%</strong></span>
        </div>
    </div>

    <!-- الرسم البياني (TradingView) -->
    <div class="chart-container">
        <div id="tradingview_chart" style="height:100%;width:100%;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
            new TradingView.widget({
                "autosize": true,
                "symbol": "BINANCE:XAUUSDT",
                "interval": "15",
                "timezone": "Etc/UTC",
                "theme": "dark",
                "style": "1",
                "locale": "ar",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "hide_top_toolbar": false,
                "save_image": false,
                "container_id": "tradingview_chart"
            });
        </script>
    </div>

    <script>
        const priceElement = document.getElementById('price');
        const statusElement = document.getElementById('status');

        async function fetchPrecisePrice() {
            try {
                // جلب السعر من سيرفر بينانس الأساسي (Spot API) لضمان الدقة وتطابق السعر مع الشارت
                const response = await fetch('https://api.binance.com/api/v3/ticker/price?symbol=PAXGUSDT');
                const data = await response.json();

                if (data && data.price) {
                    const priceValue = parseFloat(data.price).toFixed(2);
                    priceElement.innerText = `$${priceValue}`;
                    statusElement.innerText = "● متصل (سعر دقيق مطابق للشارت)";
                    statusElement.style.color = "#10b981";
                }
            } catch (err) {
                // خطة بديلة فورية لو حصل أي حظر لـ api.binance.com على شبكة الموبايل
                try {
                    const fallbackRes = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=pax gold&vs_currencies=usd');
                    const fallbackData = await fallbackRes.json();
                    if (fallbackData && fallbackData['pax gold']) {
                        const priceValue = parseFloat(fallbackData['pax gold'].usd).toFixed(2);
                        priceElement.innerText = `$${priceValue}`;
                        statusElement.innerText = "● متصل (وضع الأمان البديل)";
                        statusElement.style.color = "#38bdf8";
                    }
                } catch (e) {
                    statusElement.innerText = "⚠️ جاري إعادة الاتصال...";
                    statusElement.style.color = "#f59e0b";
                }
            }
        }

        // تشغيل الجلب فوراً ثم التحديث كل ثانيتين
        fetchPrecisePrice();
        setInterval(fetchPrecisePrice, 2000);
    </script>

</body>
</html>
