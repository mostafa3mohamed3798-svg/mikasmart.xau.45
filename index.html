<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Smart AI - XAUUSD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #fff; font-family: system-ui, -apple-system, sans-serif; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        
        .main-card { background: #151c2c; border-radius: 16px; padding: 20px; width: 100%; max-width: 450px; text-align: center; border: 1px solid #232d42; box-shadow: 0 10px 25px rgba(0,0,0,0.5); margin-bottom: 15px; }
        .logo-title { font-size: 1.4rem; font-weight: bold; color: #10b981; display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .symbol { font-size: 1.1rem; color: #94a3b8; font-weight: bold; margin-bottom: 10px; }
        
        .price-container { margin: 15px 0; min-height: 45px; display: flex; justify-content: center; align-items: center; }
        .live-price { font-size: 2.2rem; font-weight: bold; color: #f2a900; letter-spacing: 1px; }
        .price-status { font-size: 0.8rem; color: #10b981; margin-bottom: 10px; }
        
        .signal-box { display: inline-flex; align-items: center; gap: 8px; font-size: 1.3rem; font-weight: bold; color: #10b981; margin-bottom: 8px; }
        .strength { color: #10b981; font-size: 1.1rem; margin-bottom: 15px; }
        
        .chart-card { background: #151c2c; border-radius: 16px; padding: 10px; width: 100%; max-width: 450px; border: 1px solid #232d42; height: 420px; }
        .tradingview-widget-container { height: 100%; width: 100%; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="logo-title">🤖 Mika Smart AI</div>
        <div class="symbol">XAU/USDT - Binance Direct</div>
        
        <div class="price-container">
            <div id="binance-price" class="live-price">جاري التحميل...</div>
        </div>
        <div class="price-status">● سعر بينانس المباشر دون حظر</div>
        
        <div class="signal-box">
            <span style="color:#22c55e;">🟢</span> BUY
        </div>
        <div class="strength">قوة الإشارة: 91%</div>
    </div>

    <div class="chart-card">
        <div class="tradingview-widget-container">
          <div id="tradingview_chart" style="height:100%;width:100%;"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
          <script type="text/javascript">
          new TradingView.widget({
            "autosize": true,
            "symbol": "TVC:GOLD",
            "interval": "15",
            "timezone": "Etc/UTC",
            "theme": "dark",
            "style": "1",
            "locale": "ar",
            "toolbar_bg": "#f1f3f6",
            "enable_publishing": false,
            "hide_top_toolbar": false,
            "save_image": false,
            "container_id": "tradingview_chart"
          });
          </script>
        </div>
    </div>

    <script>
        async function updatePrice() {
            try {
                // قراءة ملف البيانات المحدث آلياً من GitHub Actions
                const response = await fetch('./data.json?t=' + new Date().getTime());
                const data = await response.json();
                
                if (data && data.price) {
                    const formattedPrice = parseFloat(data.price).toFixed(2);
                    document.getElementById('binance-price').innerText = `$${formattedPrice}`;
                }
            } catch (error) {
                console.error("خطأ في جلب السعر:", error);
            }
        }

        // تشغيل الجلب فوراً وتحديثه كل 5 ثواني
        updatePrice();
        setInterval(updatePrice, 5000);
    </script>

</body>
</html>
