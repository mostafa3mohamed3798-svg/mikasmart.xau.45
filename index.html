<body>

    <!-- كارت إدخال التوكن الآمن (يُحفظ في متصفحك فقط ولا يظهر على GitHub) -->

    <script>
        // استرجاع التوكن والـ Chat ID المخزنين محلياً في متصفحك
        document.getElementById('botTokenInput').value = localStorage.getItem('mika_bot_token') || '';
        document.getElementById('chatIdInput').value = localStorage.getItem('mika_chat_id') || '';

        function saveTelegramSettings() {
            const token = document.getElementById('botTokenInput').value.trim();
            const chatId = document.getElementById('chatIdInput').value.trim();
            if(!token || !chatId) {
                alert("الرجاء إدخال التوكن و Chat ID بشكل صحيح!");
                return;
            }
            localStorage.setItem('mika_bot_token', token);
            localStorage.setItem('mika_chat_id', chatId);
            alert("تم حفظ بيانات التيليجرام في متصفحك بأمان تام! ✅");
        }

        let lastSentSignal = "";
        let lastSentTime = 0;

        const priceElement = document.getElementById('price');
        const statusElement = document.getElementById('status');
        const signalTagElement = document.getElementById('signalTag');
        const signalPowerElement = document.getElementById('signalPower');

        const trendFilterVal = document.getElementById('trendFilterVal');
        const stochFilterVal = document.getElementById('stochFilterVal');
        const rsiFilterVal = document.getElementById('rsiFilterVal');
        const volFilterVal = document.getElementById('volFilterVal');
        
        let lastPrice = 0;
        let currentTimeframe = '15';
        let showEMAs = true;
        let showVolume = true;

        // 1. إرسال التنبيه الفوري لتيليجرام باستخدام التوكن المخزن محلياً
        async function sendTelegramAlert(signalType, price, timeframe, details) {
            const botToken = localStorage.getItem('mika_bot_token');
            const chatId = localStorage.getItem('mika_chat_id');
            if(!botToken || !chatId) return;

            const message = `🚨 *تنبيه إشارة تداول جديدة!* 🚨\n\n` +
                            `📊 *الزوج:* XAU/USDT (الذهب)\n` +
                            `⏱️ *الفريم:* ${timeframe}m\n` +
                            `🎯 *الإشارة:* ${signalType}\n` +
                            `💰 *السعر الحالي:* $${price}\n` +
                            `📝 *تفاصيل المؤشرات:* ${details}\n\n` +
                            `🤖 *المصدر:* Mika Smart AI Engine`;

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: message, parse_mode: 'Markdown' })
                });
            } catch (error) {
                console.error("Telegram error:", error);
            }
        }

        // 2. زر اختبار الاتصال لتيليجرام
        async function testTelegramAlert() {
            const botToken = localStorage.getItem('mika_bot_token');
            const chatId = localStorage.getItem('mika_chat_id');
            
            if(!botToken || !chatId) {
                alert("يرجى إدخال وحفظ Bot Token و Chat ID في الحقول بالأعلى أولاً!");
                return;
            }

            const testMsg = "✅ *تم اتصال الداشبورد وبقية المؤشرات بـ تيليجرام بنجاح!* 🚀";
            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: testMsg, parse_mode: 'Markdown' })
                });
                const data = await res.json();
                if(data.ok) alert("تم إرسال رسالة الاختبار بنجاح إلى هاتفك! 📱✨");
                else alert("خطأ من تيليجرام: " + data.description);
            } catch(err) {
                alert("فشل الاتصال: " + err.message);
            }
        }

        // 3. الصوت المحلي
        function playAlertSound(isBuy) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.value = isBuy ? 800 : 400;
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch(e) {}
        }

        // 4. تهيئة الشارت
        const chartContainer = document.getElementById('chart');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: { backgroundColor: '#020408', textColor: '#94a3b8' },
            grid: { vertLines: { color: 'rgba(30, 41, 59, 0.25)' }, horzLines: { color: 'rgba(30, 41, 59, 0.25)' } },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            priceScale: { borderColor: '#1e293b' },
            timeScale: { borderColor: '#1e293b', timeVisible: true, secondsVisible: false },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e', downColor: '#ef4444', borderVisible: true,
            borderUpColor: '#22c55e', borderDownColor: '#ef4444', wickUpColor: '#22c55e', wickDownColor: '#ef4444'
        });

        const volumeSeries = chart.addHistogramSeries({
            color: '#26a69a', priceFormat: { type: 'volume' }, priceScaleId: '', scaleMargins: { top: 0.8, bottom: 0 }
        });

        const ema50Series = chart.addLineSeries({ color: '#ffb703', lineWidth: 2, title: 'EMA 50', priceLineVisible: false });
        const ema200Series = chart.addLineSeries({ color: '#00b4d8', lineWidth: 2, title: 'EMA 200', priceLineVisible: false });

        // الدوال الحسابية للمؤشرات المؤسسية
        function calculateEMA(candles, period) {
            if (candles.length < period) return [];
            const k = 2 / (period + 1);
            let emaData = [];
            let emaPrev = candles[0].close;
            for (let i = 0; i < candles.length; i++) {
                const close = candles[i].close;
                if (i === 0) emaPrev = close;
                else emaPrev = (close * k) + (emaPrev * (1 - k));
                if (i >= period - 1) emaData.push({ time: candles[i].time, value: emaPrev });
            }
            return emaData;
        }

        function calculateRSI(candles, period = 14) {
            let gains = 0, losses = 0;
            for (let i = 1; i <= period; i++) {
                let diff = candles[i].close - candles[i - 1].close;
                if (diff >= 0) gains += diff;
                else losses -= diff;
            }
            let avgGain = gains / period;
            let avgLoss = losses / period;

            for (let i = period + 1; i < candles.length; i++) {
                let diff = candles[i].close - candles[i - 1].close;
                if (diff >= 0) {
                    avgGain = (avgGain * (period - 1) + diff) / period;
                    avgLoss = (avgLoss * (period - 1)) / period;
                } else {
                    avgGain = (avgGain * (period - 1)) / period;
                    avgLoss = (avgLoss * (period - 1) - diff) / period;
                }
            }
            let rs = avgGain / (avgLoss || 1);
            return 100 - (100 / (1 + rs));
        }

        function calculateStochastic(candles, period = 14) {
            const slice = candles.slice(-period);
            const currentClose = candles[candles.length - 1].close;
            const lowestLow = Math.min(...slice.map(c => c.low));
            const highestHigh = Math.max(...slice.map(c => c.high));
            
            const k = ((currentClose - lowestLow) / ((highestHigh - lowestLow) || 1)) * 100;
            return k;
        }

        // 5. محرك حساب دمج المؤشرات الأربعة
        function processInstitutionalFilters(candles, rawVolumeData) {
            if (candles.length < 200) return;

            const lastClose = candles[candles.length - 1].close;
            
            const ema50Data = calculateEMA(candles, 50);
            const ema200Data = calculateEMA(candles, 200);
            const lastEMA50 = ema50Data[ema50Data.length - 1].value;
            const lastEMA200 = ema200Data[ema200Data.length - 1].value;

            const isBullishTrend = lastClose > lastEMA50 && lastEMA50 > lastEMA200;
            const isBearishTrend = lastClose < lastEMA50 && lastEMA50 < lastEMA200;

            if (isBullishTrend) {
                trendFilterVal.innerText = "BULLISH 🟢";
                trendFilterVal.style.color = "#22c55e";
            } else if (isBearishTrend) {
                trendFilterVal.innerText = "BEARISH 🔴";
                trendFilterVal.style.color = "#ef4444";
            } else {
                trendFilterVal.innerText = "NEUTRAL ⚪";
                trendFilterVal.style.color = "#94a3b8";
            }

            const rsiVal = calculateRSI(candles, 14);
            rsiFilterVal.innerText = rsiVal.toFixed(1);
            if (rsiVal > 70) rsiFilterVal.style.color = "#ef4444";
            else if (rsiVal < 30) rsiFilterVal.style.color = "#22c55e";
            else rsiFilterVal.style.color = "#f59e0b";

            const stochK = calculateStochastic(candles, 14);
            stochFilterVal.innerText = `%K: ${stochK.toFixed(1)}`;
            if (stochK < 20) stochFilterVal.style.color = "#22c55e";
            else if (stochK > 80) stochFilterVal.style.color = "#ef4444";
            else stochFilterVal.style.color = "#94a3b8";

            const recentVolumes = rawVolumeData.slice(-20);
            const avgVol = recentVolumes.reduce((acc, curr) => acc + curr.value, 0) / 20;
            const lastVol = rawVolumeData[rawVolumeData.length - 1].value;
            const isHighLiquidity = lastVol > avgVol * 1.2;

            if (isHighLiquidity) {
                volFilterVal.innerText = "HIGH ⚡";
                volFilterVal.style.color = "#ffb703";
            } else {
