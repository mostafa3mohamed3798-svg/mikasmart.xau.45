<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Smart AI - Native Chart</title>
    <!-- تحميل مكتبة الرسم البياني المباشرة والمفتوحة -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0f19; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .top-price-card { 
            background: linear-gradient(145deg, #151c2c, #0e1420); 
            border-radius: 16px; 
            padding: 18px; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            border: 1px solid #232d42; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            margin-bottom: 12px; 
        }
        
        .header-title { font-size: 1.2rem; font-weight: bold; color: #10b981; margin-bottom: 4px; }
        .symbol-name { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
        
        .price-display { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: #f59e0b; 
            letter-spacing: 1px; 
            margin: 6px 0; 
            line-height: 1; 
            transition: color 0.3s ease;
        }
        .status-badge { font-size: 0.8rem; color: #10b981; margin-top: 4px; }
        
        .signal-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            margin-top: 10px; 
            padding-top: 10px; 
            border-top: 1px solid #1e293b; 
        }
        .signal-tag { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; }
        .signal-power { color: #94a3b8; font-size: 0.9rem; }

        /* حاوية الشارت المحلي */
        .chart-container { 
            background: #151c2c; 
            border-radius: 16px; 
            padding: 10px; 
            width: 100%; 
            max-width: 500px; 
            border: 1px solid #232d42; 
            height: 420px; 
            position: relative;
        }
        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="top-price-card">
        <div class="header-title">🤖 Mika Smart AI</div>
        <div class="symbol-name">Bybit Futures - XAUUSDT (شارت محلي بدون حظر)</div>
        
        <div id="price" class="price-display">جاري التحميل...</div>
        <div id="status" class="status-badge">● جاري الاتصال بالبيانات...</div>
        
        <div class="signal-container">
            <span class="signal-tag">🟢 BUY</span>
            <span class="signal-power">قوة الإشارة: <strong style="color: #fff;">91%</strong></span>
        </div>
    </div>

    <!-- حاوية الشارت التي سيرسم فيها المتصفح الشموع بنفسه -->
    <div class="chart-container">
        <div id="chart"></div>
    </div>

    <script>
        const priceElement = document.getElementById('price');
        const statusElement = document.getElementById('status');
        let lastPrice = 0;

        // 1. إنشاء الشارت المحلي باستخدام مكتبة Lightweight Charts
        const chartContainer = document.getElementById('chart');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                backgroundColor: '#151c2c',
                textColor: '#94a3b8',
            },
            grid: {
                vertLines: { color: '#1e293b' },
                horzLines: { color: '#1e293b' },
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            priceScale: { borderColor: '#232d42' },
            timeScale: { borderColor: '#232d42', timeVisible: true, secondsVisible: false },
        });

        // إضافة سلسلة الشموع اليابانية (Candlestick Series)
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e',
            downColor: '#ef4444',
            borderVisible: false,
            wickUpColor: '#22c55e',
            wickDownColor: '#ef4444',
        });

        // 2. دالة جلب تاريخ الشموع اليابانية من Bybit ورسمها
        async function loadChartData() {
            const klineUrl = 'https://api.bybit.com/v5/market/kline?category=linear&symbol=XAUUSDT&interval=15&limit=100';
            try {
                const response = await fetch(klineUrl);
                const data = await response.json();

                if (data && data.retCode === 0 && data.result && data.result.list) {
                    // تحويل بيانات Bybit لنسق الشارت
                    const formattedData = data.result.list.map(d => ({
                        time: parseInt(d[0]) / 1000,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    })).reverse();

                    candlestickSeries.setData(formattedData);
                    chart.timeScale().fitContent();
                }
            } catch (err) {
                console.error("Chart Data Fetch Error:", err);
            }
        }

        // 3. دالة جلب السعر الحي وتحديث الشمعة الأخيرة والكارت العلوي
        async function fetchBybitPrice() {
            const tickerUrl = 'https://api.bybit.com/v5/market/tickers?category=linear&symbol=XAUUSDT';

            try {
                const response = await fetch(tickerUrl);
                const data = await response.json();
                
                if (data && data.retCode === 0 && data.result && data.result.list.length > 0) {
                    const rawPrice = parseFloat(data.result.list[0].lastPrice);
                    const formattedPrice = rawPrice.toFixed(2);
                    
                    if (lastPrice > 0) {
                        if (rawPrice > lastPrice) priceElement.style.color = '#22c55e';
                        else if (rawPrice < lastPrice) priceElement.style.color = '#ef4444';
                    }
                    lastPrice = rawPrice;

                    priceElement.innerText = `$${formattedPrice}`;
                    statusElement.innerText = "● اتصال حي ومباشر بدون حظر";
                    statusElement.style.color = "#10b981";
                }
            } catch (err) {
                console.error("Price Fetch Error:", err);
                statusElement.innerText = "⚠️ جاري إعادة محاولة الاتصال...";
                statusElement.style.color = "#f59e0b";
            }
        }

        // تشغيل الجلب التلقائي
        loadChartData();
        fetchBybitPrice();
        setInterval(fetchBybitPrice, 1000); // تحديث السعر كل ثانية
        setInterval(loadChartData, 15000);   // تحديث الشموع كل 15 ثانية
    </script>

</body>
</html>
