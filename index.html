<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika Smart AI - Bybit Live</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0f19; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        .top-price-card { 
            background: linear-gradient(145deg, #151c2c, #0e1420); 
            border-radius: 16px; 
            padding: 20px; 
            width: 100%; 
            max-width: 500px; 
            text-align: center; 
            border: 1px solid #232d42; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            margin-bottom: 12px; 
        }
        
        .header-title { font-size: 1.2rem; font-weight: bold; color: #10b981; margin-bottom: 4px; }
        .symbol-name { font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px; }
        
        .price-display { 
            font-size: 2.5rem; 
            font-weight: 800; 
            color: #f59e0b; 
            letter-spacing: 1px; 
            margin: 8px 0; 
            line-height: 1; 
            transition: color 0.3s ease;
        }
        .status-badge { font-size: 0.8rem; color: #10b981; margin-top: 6px; }
        
        .signal-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            margin-top: 12px; 
            padding-top: 10px; 
            border-top: 1px solid #1e293b; 
        }
        .signal-tag { background-color: rgba(34, 197, 94, 0.15); color: #22c55e; padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; }
        .signal-power { color: #94a3b8; font-size: 0.9rem; }

        /* حاوية الشارت الأكيدة عبر Iframe */
        .chart-container { 
            background: #151c2c; 
            border-radius: 16px; 
            overflow: hidden;
            width: 100%; 
            max-width: 500px; 
            border: 1px solid #232d42; 
            height: 440px; 
        }

        .chart-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="top-price-card">
        <div class="header-title">🤖 Mika Smart AI</div>
        <div class="symbol-name">Bybit Futures - XAUUSDT</div>
        
        <div id="price" class="price-display">جاري الاتصال...</div>
        <div id="status" class="status-badge">● جاري الاتصال بـ Bybit API...</div>
        
        <div class="signal-container">
            <span class="signal-tag">🟢 BUY</span>
            <span class="signal-power">قوة الإشارة: <strong style="color: #fff;">91%</strong></span>
        </div>
    </div>

    <!-- شارت TradingView المضمون عبر iframe مباشر -->
    <div class="chart-container">
        <iframe src="https://s.tradingview.com/widgetembed/?frameElementId=tradingview_widget&symbol=BYBIT%3AXAUUSDT&interval=15&hidesidetoolbar=1&symboledit=1&saveimage=0&toolbarbg=f1f3f6&theme=dark&style=1&timezone=Etc%2FUTC&locale=ar"></iframe>
    </div>

    <script>
        const priceElement = document.getElementById('price');
        const statusElement = document.getElementById('status');
        let lastPrice = 0;

        async function fetchBybitPrice() {
            const bybitUrl = 'https://api.bybit.com/v5/market/tickers?category=linear&symbol=XAUUSDT';

            try {
                const response = await fetch(bybitUrl);
                const data = await response.json();
                
                if (data && data.retCode === 0 && data.result && data.result.list.length > 0) {
                    const rawPrice = parseFloat(data.result.list[0].lastPrice);
                    const formattedPrice = rawPrice.toFixed(2);
                    
                    if (lastPrice > 0) {
                        if (rawPrice > lastPrice) {
                            priceElement.style.color = '#22c55e';
                        } else if (rawPrice < lastPrice) {
                            priceElement.style.color = '#ef4444';
                        }
                    }
                    lastPrice = rawPrice;

                    priceElement.innerText = `$${formattedPrice}`;
                    statusElement.innerText = "● اتصال مباشر بالسعر الحي (Bybit API)";
                    statusElement.style.color = "#10b981";
                }
            } catch (err) {
                console.error("Bybit Fetch Error:", err);
                statusElement.innerText = "⚠️ جاري إعادة الاتصال...";
                statusElement.style.color = "#f59e0b";
            }
        }

        fetchBybitPrice();
        setInterval(fetchBybitPrice, 1000);
    </script>

</body>
</html>
