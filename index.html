    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            background-color: #0b0f19; 
            color: #fff; 
            font-family: system-ui, -apple-system, sans-serif; 
            padding: 12px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        
        /* كارت السعر والتحليل الرئيسي */
        .top-price-card { 
            background: linear-gradient(145deg, #151c2c, #0e1420); 
            border-radius: 16px; 
            padding: 18px; 
            width: 100%; 
            max-width: 580px; 
            text-align: center; 
            border: 1px solid #232d42; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); 
            margin-bottom: 12px;

        .header-title { font-size: 1.25rem; font-weight: bold; color: #10b981; margin-bottom: 4px; }

        .price-display { 
            font-size: 2.7rem; 
            font-weight: 800; 
            color: #f59e0b; 
            letter-spacing: 1px; 
            margin: 4px 0; 
            line-height: 1; 
            transition: color 0.3s ease;
        }
        .status-badge { font-size: 0.8rem; color: #10b981; margin-top: 4px; }
        
        .signal-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 15px; 
            margin-top: 10px; 
            padding-top: 10px; 
            border-top: 1px solid #1e293b; 
        }

        .signal-tag { 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 0.95rem; 
            transition: all 0.3s ease;
        }
        .signal-buy { background-color: rgba(34, 197, 94, 0.18); color: #22c55e; border: 1px solid #22c55e; box-shadow: 0 0 10px rgba(34, 197, 94, 0.2); }
        .signal-sell { background-color: rgba(239, 68, 68, 0.18); color: #ef4444; border: 1px solid #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        .signal-wait { background-color: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid #94a3b8; }

        .signal-power { color: #94a3b8; font-size: 0.9rem; }

        /* زر اختبار تيليجرام */
        .btn-telegram-test {
            background: #10b981;
            color: #0b0f19;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 12px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }
        .btn-telegram-test:hover { opacity: 0.9; transform: scale(1.02); }

        /* شريط معلومات الفلاتر والسيولة والأخبار */
        .filters-dashboard {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 580px;
            margin-bottom: 12px;
        }

        .filter-card {
            background: #151c2c;
            border: 1px solid #232d42;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
        }

        .filter-label { font-size: 0.72rem; color: #64748b; font-weight: 600; margin-bottom: 4px; }
        .filter-value { font-size: 0.85rem; font-weight: bold; color: #f8fafc; }

        /* حاوية الشارت الخارجية */
        .chart-card {
            background: #151c2c; 
            border-radius: 16px; 
            padding: 12px; 
            width: 100%; 
            max-width: 580px; 
            border: 1px solid #232d42; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* شريط التحكم بالفريمات والمؤشرات */
        .chart-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            background: #0e1420;
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #1e293b;
        }

        .tf-group, .indicator-group {
            display: flex;
            gap: 4px;
        }

        .tf-btn, .indicator-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tf-btn:hover, .indicator-btn:hover {
            color: #fff;
            border-color: #10b981;
        }

        .tf-btn.active {
            background: #10b981;
            color: #0b0f19;
            border-color: #10b981;
        }

        .btn-ema.active { background: rgba(255, 183, 3, 0.2); color: #ffb703; border-color: #ffb703; }
        .btn-vol.active { background: rgba(16, 185, 129, 0.2); color: #10b981; border-color: #10b981; }

        /* غلاف الشموع الداخلي أسود عميق */
        .chart-container { 
            width: 100%; 
            height: 500px; 
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #000;
        }

        #chart {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- الكارت الرئيسي بالإشارة الحية -->
    <div class="top-price-card">
        <div class="header-title">🤖 Mika Smart AI Engine</div>
        <div class="symbol-name">Bybit Futures - XAUUSDT</div>
        
        <div id="price" class="price-display">جاري التحميل...</div>
        <div id="status" class="status-badge">● جاري حساب الفلاتر الحية...</div>
        
        <div class="signal-container">
            <span id="signalTag" class="signal-tag signal-wait">⚪ ANALYZING MARKET...</span>
            <span class="signal-power">قوة الإشارة: <strong id="signalPower" style="color: #fff;">0%</strong></span>

        <div>
            <button class="btn-telegram-test" onclick="testTelegramAlert()">🚀 تجربة إشعار تيليجرام</button>
        </div>

    <!-- شبكة فلاتر التداول الذكية -->
    <div class="filters-dashboard">
        <div class="filter-card">
            <div class="filter-label">📈 TREND FILTER</div>
            <div id="trendFilterVal" class="filter-value" style="color: #94a3b8;">--</div>
        </div>
        <div class="filter-card">
            <div class="filter-label">💧 LIQUIDITY / VOL</div>
            <div id="volFilterVal" class="filter-value" style="color: #94a3b8;">--</div>
        </div>
        <div class="filter-card">
            <div class="filter-label">🎯 S&R LEVELS</div>
            <div id="srFilterVal" class="filter-value" style="color: #94a3b8;">--</div>
        </div>
    </div>

    <!-- الشارت الاحترافي -->
    <div class="chart-card">
        <div class="chart-toolbar">
            <div class="tf-group">
                <button class="tf-btn" onclick="changeTimeframe('1')">1m</button>
                <button class="tf-btn" onclick="changeTimeframe('5')">5m</button>
                <button class="tf-btn active" onclick="changeTimeframe('15')">15m</button>
                <button class="tf-btn" onclick="changeTimeframe('60')">1h</button>
                <button class="tf-btn" onclick="changeTimeframe('240')">4h</button>
                <button class="tf-btn" onclick="changeTimeframe('D')">1D</button>
            </div>
            <div class="indicator-group">
                <button id="emaToggle" class="indicator-btn btn-ema active" onclick="toggleEMA()">EMAs</button>
                <button id="volToggle" class="indicator-btn btn-vol active" onclick="toggleVolume()">Volume</button>
            </div>
        </div>

        <div class="chart-container">
            <div id="chart"></div>
        </div>
    </div>

    <script>
        // إعدادات البوت والـ Chat ID الخاصة بك
        const TELEGRAM_BOT_TOKEN = '8942146381:AAFRkzmitQM6rnWOwhsy0DZRgoBoaILtNYo';
        const TELEGRAM_CHAT_ID = '1009314819';

        let lastSentSignal = "";
        let lastSentTime = 0;

        const priceElement = document.getElementById('price');
        const statusElement = document.getElementById('status');
        const signalTagElement = document.getElementById('signalTag');
        const signalPowerElement = document.getElementById('signalPower');

        const trendFilterVal = document.getElementById('trendFilterVal');
        const volFilterVal = document.getElementById('volFilterVal');
        const srFilterVal = document.getElementById('srFilterVal');
        
        let lastPrice = 0;
        let currentTimeframe = '15';
        let showEMAs = true;
        let showVolume = true;

        // 1. إرسال التنبيهات الفورية لتيليجرام
        async function sendTelegramAlert(signalType, price, timeframe) {
            const message = `🚨 *تنبيه إشارة تداول جديدة!* 🚨\n\n` +
                            `📊 *الزوج:* XAU/USDT (الذهب)\n` +
                            `⏱️ *الفريم:* ${timeframe}m\n` +
                            `🎯 *الإشارة:* ${signalType}\n` +
                            `💰 *السعر الحالي:* $${price}\n\n` +
                            `🤖 *المصدر:* Mika Smart AI Engine`;

            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'Markdown'
                    })
                });
                console.log("✅ تم إرسال الإشعار لتيليجرام بنجاح");
            } catch (error) {
                console.error("❌ فشل إرسال الإشعار لتيليجرام:", error);
            }
        }

        // 2. زر اختبار الاتصال لتيليجرام
        async function testTelegramAlert() {
            const testMsg = "✅ *تم اتصال الداشبورد ببوت تيليجرام بنجاح!*\n\nجاهز لاستقبال إشارات الذهب الفورية (XAU/USDT) 🚀";
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: testMsg, parse_mode: 'Markdown' })
                });
                const data = await res.json();
                if(data.ok) {
                    alert("تم إرسال رسالة الاختبار بنجاح إلى هاتفك! 📱✨");
                } else {
                    alert("حدث خطأ في الإرسال: " + data.description);
                }
            } catch(err) {
                alert("فشل الاتصال: " + err.message);
            }
        }

        // 3. الصوت المحلي للمتصفح
        function playAlertSound(isBuy) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                osc.frequency.value = isBuy ? 800 : 400;
                osc.type = 'sine';
                
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.8);
                
                osc.start();
                osc.stop(ctx.currentTime + 0.8);
            } catch(e) {}
        }

        // 4. تهيئة الشارت
        const chartContainer = document.getElementById('chart');
        const chart = LightweightCharts.createChart(chartContainer, {
            layout: {
                backgroundColor: '#020408',
                textColor: '#94a3b8',
            },
            grid: {
                vertLines: { color: 'rgba(30, 41, 59, 0.25)' },
                horzLines: { color: 'rgba(30, 41, 59, 0.25)' },
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            priceScale: { borderColor: '#1e293b' },
            timeScale: { borderColor: '#1e293b', timeVisible: true, secondsVisible: false },
        });

        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#22c55e',
            downColor: '#ef4444',
            borderVisible: true,
            borderUpColor: '#22c55e',
            borderDownColor: '#ef4444',
            wickUpColor: '#22c55e',
            wickDownColor: '#ef4444',
        });

        const volumeSeries = chart.addHistogramSeries({
            color: '#26a69a',
            priceFormat: { type: 'volume' },
            priceScaleId: '',
            scaleMargins: { top: 0.8, bottom: 0 },
        });

        const ema50Series = chart.addLineSeries({ color: '#ffb703', lineWidth: 2, title: 'EMA 50', priceLineVisible: false });
        const ema200Series = chart.addLineSeries({ color: '#00b4d8', lineWidth: 2, title: 'EMA 200', priceLineVisible: false });

        const resLine = chart.addLineSeries({ color: '#ef4444', lineWidth: 1, lineStyle: 2, priceLineVisible: false, title: 'Res' });
        const supLine = chart.addLineSeries({ color: '#22c55e', lineWidth: 1, lineStyle: 2, priceLineVisible: false, title: 'Sup' });

        function calculateEMA(candles, period) {
            if (candles.length < period) return [];
            const k = 2 / (period + 1);
            let emaData = [];
            let emaPrev = candles[0].close;

            for (let i = 0; i < candles.length; i++) {
                const close = candles[i].close;
                if (i === 0) emaPrev = close;
                else emaPrev = (close * k) + (emaPrev * (1 - k));
                
                if (i >= period - 1) {
                    emaData.push({ time: candles[i].time, value: emaPrev });
                }
            }
            return emaData;
        }

        // 5. خوارزمية حساب الإشارات والفلاتر
        function processInstitutionalFilters(candles, rawVolumeData) {
            if (candles.length < 200) return;

            const lastCandle = candles[candles.length - 1];
            const lastClose = lastCandle.close;
            
            const ema50Data = calculateEMA(candles, 50);
            const ema200Data = calculateEMA(candles, 200);

            const lastEMA50 = ema50Data[ema50Data.length - 1].value;
            const lastEMA200 = ema200Data[ema200Data.length - 1].value;

            const isBullishTrend = lastClose > lastEMA50 && lastEMA50 > lastEMA200;
            const isBearishTrend = lastClose < lastEMA50 && lastEMA50 < lastEMA200;

            if (isBullishTrend) {
                trendFilterVal.innerText = "STRONG BULLISH 🟢";
                trendFilterVal.style.color = "#22c55e";
            } else if (isBearishTrend) {
                trendFilterVal.innerText = "STRONG BEARISH 🔴";
                trendFilterVal.style.color = "#ef4444";
            } else {
                trendFilterVal.innerText = "SIDEWAYS ⚪";
                trendFilterVal.style.color = "#94a3b8";
            }

            const recentVolumes = rawVolumeData.slice(-20);
            const avgVol = recentVolumes.reduce((acc, curr) => acc + curr.value, 0) / 20;
            const lastVol = rawVolumeData[rawVolumeData.length - 1].value;

            const isHighLiquidity = lastVol > avgVol * 1.25;
            if (isHighLiquidity) {
                volFilterVal.innerText = "HIGH LIQUIDITY ⚡";
                volFilterVal.style.color = "#ffb703";
            } else {
                volFilterVal.innerText = "NORMAL 💧";
                volFilterVal.style.color = "#94a3b8";
            }

            const recentCandles = candles.slice(-50);
            const highestRes = Math.max(...recentCandles.map(c => c.high));
            const lowestSup = Math.min(...recentCandles.map(c => c.low));

            srFilterVal.innerText = `R:${highestRes.toFixed(1)} | S:${lowestSup.toFixed(1)}`;
            srFilterVal.style.color = "#00b4d8";

            const resData = candles.map(c => ({ time: c.time, value: highestRes }));
            const supData = candles.map(c => ({ time: c.time, value: lowestSup }));
            resLine.setData(resData);
            supLine.setData(supData);

            let signalText = "⚪ WAIT";
            let signalClass = "signal-wait";
            let power = 50;

            if (isBullishTrend && isHighLiquidity) {
                signalText = "🟢 STRONG BUY";
                signalClass = "signal-buy";
                power = 95;
            } else if (isBullishTrend) {
                signalText = "🟢 BUY";
                signalClass = "signal-buy";
                power = 80;
            } else if (isBearishTrend && isHighLiquidity) {
                signalText = "🔴 STRONG SELL";
                signalClass = "signal-sell";
                power = 95;
            } else if (isBearishTrend) {
                signalText = "🔴 SELL";
                signalClass = "signal-sell";
                power = 80;
            } else {
                signalText = "⚪ NO CLEAR SETUP";
                signalClass = "signal-wait";
                power = 40;
            }

            signalTagElement.innerText = signalText;
            signalTagElement.className = `signal-tag ${signalClass}`;
            signalPowerElement.innerText = `${power}%`;

            // فحص وإرسال الإشعارات التلقائية
            const now = Date.now();
            if ((signalText.includes("STRONG BUY") || signalText.includes("STRONG SELL")) && 
                (signalText !== lastSentSignal || (now - lastSentTime > 300000))) {
                
                lastSentSignal = signalText;
                lastSentTime = now;
                playAlertSound(signalText.includes("BUY"));
                sendTelegramAlert(signalText, lastClose.toFixed(2), currentTimeframe);
            }

            if (showEMAs) {
                ema50Series.setData(ema50Data);
                ema200Series.setData(ema200Data);
            } else {
                ema50Series.setData([]);
                ema200Series.setData([]);
            }
        }

        async function loadChartData() {
            const klineUrl = `https://api.bybit.com/v5/market/kline?category=linear&symbol=XAUUSDT&interval=${currentTimeframe}&limit=300`;
            try {
                const response = await fetch(klineUrl);
                const data = await response.json();

                if (data && data.retCode === 0 && data.result && data.result.list) {
                    const list = data.result.list.reverse();

                    const formattedCandles = list.map(d => ({
                        time: parseInt(d[0]) / 1000,
                        open: parseFloat(d[1]),
                        high: parseFloat(d[2]),
                        low: parseFloat(d[3]),
                        close: parseFloat(d[4])
                    }));

                    const formattedVolume = list.map(d => ({
                        time: parseInt(d[0]) / 1000,
                        value: parseFloat(d[5]),
                        color: parseFloat(d[4]) >= parseFloat(d[1]) ? 'rgba(34, 197, 94, 0.4)' : 'rgba(239, 68, 68, 0.4)'
                    }));

                    candlestickSeries.setData(formattedCandles);
